<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noisemaker</title>
<meta name="description" content="Generate procedural noise maps in the browser and export them as PNG, JPG, WebP, BMP, TGA or RAW16 heightmaps.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7cff'/%3E%3Cstop offset='1' stop-color='%234fd1c5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <h1>noisemaker</h1>
    <span class="tagline">procedural noise maps, in your browser</span>
  </div>
  <div class="top-actions">
    <button id="randomize" class="btn ghost" type="button">Randomize</button>
    <button id="reset" class="btn ghost" type="button">Reset</button>
  </div>
</header>

<main class="layout">
  <aside class="panel" id="panel">
    <section class="group">
      <h2>Presets</h2>
      <div class="presets" id="presets"></div>
    </section>

    <section class="group">
      <h2>Noise</h2>
      <div class="segmented four" role="radiogroup" aria-label="Noise type">
        <label><input type="radio" name="type" data-key="type" value="perlin"><span>Perlin</span></label>
        <label><input type="radio" name="type" data-key="type" value="value"><span>Value</span></label>
        <label><input type="radio" name="type" data-key="type" value="worley"><span>Worley</span></label>
        <label><input type="radio" name="type" data-key="type" value="white"><span>White</span></label>
      </div>

      <div class="field">
        <div class="row"><span>Seed</span></div>
        <div class="seed-row">
          <input type="number" data-key="seed" step="1">
          <button id="reseed" class="btn icon" type="button" title="New seed (R)" aria-label="New seed">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <label class="field range" data-show="type!=white">
        <div class="row"><span>Scale</span><output data-for="scale"></output></div>
        <input type="range" data-key="scale" min="1" max="32" step="0.5">
      </label>

      <label class="toggle" data-show="type!=white">
        <input type="checkbox" data-key="tileable">
        <span class="switch"></span>
        <span>Seamless tiling</span>
      </label>

      <div class="sub" data-show="type=worley">
        <label class="field">
          <div class="row"><span>Distance</span></div>
          <select data-key="cell">
            <option value="f1">F1 · nearest point</option>
            <option value="f2">F2 · second nearest</option>
            <option value="edges">F2 − F1 · cell edges</option>
            <option value="cells">Cell ID · flat cells</option>
          </select>
        </label>
        <label class="field">
          <div class="row"><span>Metric</span></div>
          <select data-key="metric">
            <option value="euclidean">Euclidean</option>
            <option value="manhattan">Manhattan</option>
            <option value="chebyshev">Chebyshev</option>
          </select>
        </label>
        <label class="field range">
          <div class="row"><span>Jitter</span><output data-for="jitter"></output></div>
          <input type="range" data-key="jitter" min="0" max="1" step="0.01">
        </label>
      </div>
    </section>

    <section class="group" data-show="type!=white">
      <h2>Fractal</h2>
      <div class="segmented four" role="radiogroup" aria-label="Fractal mode">
        <label><input type="radio" name="fractal" data-key="fractal" value="none"><span>None</span></label>
        <label><input type="radio" name="fractal" data-key="fractal" value="fbm"><span>fBm</span></label>
        <label><input type="radio" name="fractal" data-key="fractal" value="ridged"><span>Ridged</span></label>
        <label><input type="radio" name="fractal" data-key="fractal" value="billow"><span>Billow</span></label>
      </div>
      <div data-show="fractal!=none">
        <label class="field range">
          <div class="row"><span>Octaves</span><output data-for="octaves"></output></div>
          <input type="range" data-key="octaves" min="1" max="10" step="1">
        </label>
        <label class="field range">
          <div class="row"><span>Lacunarity</span><output data-for="lacunarity"></output></div>
          <input type="range" data-key="lacunarity" min="1.2" max="4" step="0.05">
        </label>
        <label class="field range">
          <div class="row"><span>Gain</span><output data-for="gain"></output></div>
          <input type="range" data-key="gain" min="0.1" max="0.9" step="0.01">
        </label>
      </div>
      <label class="field range">
        <div class="row"><span>Domain warp</span><output data-for="warp"></output></div>
        <input type="range" data-key="warp" min="0" max="3" step="0.05">
      </label>
    </section>

    <section class="group">
      <h2>Adjust</h2>
      <label class="field range">
        <div class="row"><span>Contrast</span><output data-for="contrast"></output></div>
        <input type="range" data-key="contrast" min="0" max="3" step="0.05">
      </label>
      <label class="field range">
        <div class="row"><span>Brightness</span><output data-for="brightness"></output></div>
        <input type="range" data-key="brightness" min="-0.5" max="0.5" step="0.01">
      </label>
      <label class="field range">
        <div class="row"><span>Posterize</span><output data-for="steps"></output></div>
        <input type="range" data-key="steps" min="1" max="16" step="1">
      </label>
      <div class="toggles">
        <label class="toggle">
          <input type="checkbox" data-key="invert">
          <span class="switch"></span>
          <span>Invert</span>
        </label>
        <label class="toggle">
          <input type="checkbox" data-key="normalize">
          <span class="switch"></span>
          <span>Auto-levels</span>
        </label>
      </div>
    </section>

  </aside>

  <section class="stage">
    <div class="stage-bar">
      <label class="toggle compact">
        <input type="checkbox" data-key="tilePreview">
        <span class="switch"></span>
        <span>Tile 2×2</span>
      </label>
    </div>
    <div class="viewport" id="viewport">
      <canvas id="view" width="512" height="512"></canvas>
      <div class="busy" id="busy"><span></span></div>
    </div>

    <div class="export">
      <label class="field">
        <div class="row"><span>Resolution</span></div>
        <select data-key="size">
          <option value="128">128 × 128</option>
          <option value="256">256 × 256</option>
          <option value="512">512 × 512</option>
          <option value="1024">1024 × 1024</option>
          <option value="2048">2048 × 2048</option>
          <option value="4096">4096 × 4096</option>
        </select>
      </label>
      <label class="field">
        <div class="row"><span>Format</span></div>
        <select data-key="format">
          <option value="png">PNG</option>
          <option value="jpg">JPG</option>
          <option value="jpeg">JPEG</option>
          <option value="webp">WebP</option>
          <option value="bmp">BMP (24-bit)</option>
          <option value="tga">TGA (32-bit)</option>
          <option value="r16">RAW16 heightmap (.r16)</option>
        </select>
      </label>
      <label class="field range quality" data-show="format=jpg|jpeg|webp">
        <div class="row"><span>Quality</span><output data-for="quality"></output></div>
        <input type="range" data-key="quality" min="0.5" max="1" step="0.01">
      </label>
      <div class="export-actions">
        <button id="copy" class="btn ghost" type="button">Copy PNG</button>
        <button id="download" class="btn primary" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          <span>Export</span>
        </button>
      </div>
      <div class="progress" id="progress" hidden><span></span></div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
